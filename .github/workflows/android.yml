name: Android build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # На ubuntu-latest Android SDK уже установлен (ANDROID_HOME),
      # поэтому отдельный setup-android не нужен: он падает на пакете 'tools'.
      - name: Install NDK and CMake
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      # ---- Необязательные движки. Любой из этих шагов может упасть: приложение всё равно соберётся,
      # просто нужного движка не будет в списке. Причина видна в логе шага.
      - name: Build zapret tpws (optional)
        continue-on-error: true
        run: |
          ZV=v71
          BIN="$ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin"
          WORK="$RUNNER_TEMP/zapret"
          is_elf() { [ -s "$1" ] && [ "$(head -c4 "$1" | tail -c3)" = "ELF" ]; }
          git clone --depth 1 --branch "$ZV" https://github.com/bol-van/zapret.git "$WORK" || { echo "::warning::zapret не скачался"; exit 0; }
          for pair in "arm64-v8a:aarch64-linux-android21:android-arm64" "armeabi-v7a:armv7a-linux-androideabi21:android-arm"; do
            IFS=: read -r ABI TRIPLE REL <<< "$pair"
            OUT="android/app/src/main/jniLibs/$ABI"; mkdir -p "$OUT"
            CC="$BIN/$TRIPLE-clang"
            LOG="$RUNNER_TEMP/tpws-$ABI.log"; : > "$LOG"
            rm -f "$WORK/tpws/tpws"
            # 1) штатная цель android  2) обычная сборка  3) прямая компиляция NDK-компилятором
            make -C "$WORK/tpws" clean >/dev/null 2>&1 || true
            make -C "$WORK/tpws" android CC="$CC" >>"$LOG" 2>&1 || true
            is_elf "$WORK/tpws/tpws" || { make -C "$WORK/tpws" clean >/dev/null 2>&1 || true; make -C "$WORK/tpws" CC="$CC" >>"$LOG" 2>&1 || true; }
            is_elf "$WORK/tpws/tpws" || "$CC" -std=gnu99 -Os -s -Wno-address-of-packed-member -o "$WORK/tpws/tpws" "$WORK"/tpws/*.c -lz >>"$LOG" 2>&1 || true
            if is_elf "$WORK/tpws/tpws"; then
              cp "$WORK/tpws/tpws" "$OUT/libtpws.so"; echo "tpws $ABI: собран из исходников"
            else
              tail -25 "$LOG"; echo "::warning::tpws для $ABI не собрался из исходников"
            fi
          done
          # 4) запасной вариант: готовые бинарники из релиза zapret (MIT)
          for pair in "arm64-v8a:android-arm64" "armeabi-v7a:android-arm"; do
            IFS=: read -r ABI REL <<< "$pair"
            OUT="android/app/src/main/jniLibs/$ABI"
            [ -s "$OUT/libtpws.so" ] && continue
            if [ ! -d "$RUNNER_TEMP/zrel" ]; then
              mkdir -p "$RUNNER_TEMP/zrel"
              curl -fsSL "https://github.com/bol-van/zapret/releases/download/$ZV/zapret-$ZV.tar.gz" | tar -xz -C "$RUNNER_TEMP/zrel" || true
            fi
            F=$(find "$RUNNER_TEMP/zrel" -path "*binaries/$REL/tpws" 2>/dev/null | head -1)
            if [ -n "$F" ] && is_elf "$F"; then cp "$F" "$OUT/libtpws.so"; echo "tpws $ABI: взят готовый из релиза"; fi
          done

      - name: Fetch sing-box (optional)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Линейка 1.12: есть фрагментация TLS в правилах маршрута и WireGuard endpoint для WARP
          VER=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/SagerNet/sing-box/releases?per_page=100" \
            | python3 -c "import sys,json,re; print('\n'.join(x['tag_name'] for x in json.load(sys.stdin) if re.fullmatch(r'v1\.12\.\d+', x['tag_name'])))" \
            | sort -V | tail -1) || VER=""
          [ -n "$VER" ] || { echo "::warning::версия sing-box 1.12.x не найдена"; exit 0; }
          echo "sing-box $VER" | tee "$RUNNER_TEMP/singbox-version.txt"
          T="$RUNNER_TEMP/sb"; mkdir -p "$T"
          for pair in "arm64-v8a:android-arm64" "armeabi-v7a:android-armv7" "x86_64:android-amd64"; do
            IFS=: read -r ABI SUF <<< "$pair"
            OUT="android/app/src/main/jniLibs/$ABI"; mkdir -p "$OUT"
            URL="https://github.com/SagerNet/sing-box/releases/download/$VER/sing-box-${VER#v}-$SUF.tar.gz"
            if curl -fsSL -o "$T/$ABI.tgz" "$URL"; then
              mkdir -p "$T/$ABI" && tar -xzf "$T/$ABI.tgz" -C "$T/$ABI"
              F=$(find "$T/$ABI" -type f -name sing-box | head -1)
              if [ -n "$F" ]; then cp "$F" "$OUT/libsingbox.so"; echo "sing-box $ABI: готов"; fi
            else
              echo "::warning::нет файла $URL"
            fi
          done

      - uses: actions/setup-go@v5
        if: ${{ hashFiles('android/app/src/main/jniLibs/arm64-v8a/libsingbox.so') == '' }}
        continue-on-error: true
        with:
          go-version: stable

      - name: Build sing-box from source (fallback, optional)
        if: ${{ hashFiles('android/app/src/main/jniLibs/arm64-v8a/libsingbox.so') == '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BIN="$ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin"
          VER=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/SagerNet/sing-box/releases?per_page=100" \
            | python3 -c "import sys,json,re; print('\n'.join(x['tag_name'] for x in json.load(sys.stdin) if re.fullmatch(r'v1\.12\.\d+', x['tag_name'])))" \
            | sort -V | tail -1) || VER=""
          [ -n "$VER" ] || { echo "::warning::версия sing-box 1.12.x не найдена"; exit 0; }
          git clone --depth 1 --branch "$VER" https://github.com/SagerNet/sing-box.git "$RUNNER_TEMP/sing-box-src" || exit 0
          cd "$RUNNER_TEMP/sing-box-src"
          TAGS="with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_clash_api"
          mkdir -p "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a" "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/armeabi-v7a"
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$BIN/aarch64-linux-android21-clang" \
            go build -trimpath -ldflags "-s -w -buildid=" -tags "$TAGS" -o "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libsingbox.so" ./cmd/sing-box || echo "::warning::sing-box arm64 не собрался"
          CGO_ENABLED=1 GOOS=android GOARCH=arm GOARM=7 CC="$BIN/armv7a-linux-androideabi21-clang" \
            go build -trimpath -ldflags "-s -w -buildid=" -tags "$TAGS" -o "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/armeabi-v7a/libsingbox.so" ./cmd/sing-box || echo "::warning::sing-box armv7 не собрался"

      - name: Extra engines summary
        run: |
          echo "Дополнительные движки в APK:"
          ls -la android/app/src/main/jniLibs/*/ 2>/dev/null || echo "нет (приложение соберётся только с ByeDPI)"

      # Если в репозитории заданы секреты WT_KEYSTORE_*, APK подписывается вашим постоянным ключом
      - name: Prepare signing key (if secrets are set)
        env:
          KS: ${{ secrets.WT_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.WT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WT_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.WT_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/wt.jks"
            echo "WT_KEYSTORE_FILE=$RUNNER_TEMP/wt.jks" >> "$GITHUB_ENV"
            echo "WT_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "WT_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "WT_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "Подпись: постоянный ключ"
          else
            echo "Подпись: временный debug-ключ (секреты не заданы)"
          fi

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle -p android assembleDebug

      - name: Build release APK (only with signing key)
        run: |
          if [ -n "$WT_KEYSTORE_FILE" ]; then gradle -p android assembleRelease; fi

      - uses: actions/upload-artifact@v4
        with:
          name: wolf-tower-apk
          path: android/app/build/outputs/apk/**/*.apk
